name: Educational notebooks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  cpu-demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: [data-analysis, pytorch, tensorflow]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      MLLAB_QUICK: '1'
      MLLAB_USE_GPU: '0'
      MLLAB_ALLOW_DOWNLOAD: '0'
      MLLAB_DATA_SOURCE: demo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        if: matrix.group == 'pytorch'
        run: python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install group dependencies
        run: python -m pip install -r requirements/${{ matrix.group }}.txt
      - name: Unit checks
        run: python -m unittest discover -s tests -v
      - name: Run notebooks
        run: python tools/run_notebooks.py --group ${{ matrix.group }}
